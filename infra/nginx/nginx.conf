server {
    listen 80;
    server_name _;

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        # Port explicite : $host seul retombe sur le 443 implicite (non mappe, lien casse).
        # A adapter ici si NGINX_HTTPS_HOST_PORT (.env, defaut 8443) change un jour.
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/travel-plan.crt;
    ssl_certificate_key /etc/nginx/certs/travel-plan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Resolution DNS a chaque requete (pas juste au demarrage) : survit au redemarrage des services.
    resolver 127.0.0.11 valid=10s;

    # Certificat interne partage (infra/internal-tls) : verifie la chaine plutot que de la desactiver.
    proxy_ssl_trusted_certificate /etc/nginx/internal-certs/internal.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # fix/audit-gaps (troubleshooting.md #40) : aucun header de securite n'etait envoye - pas de
    # defense en profondeur en cas d'XSS introduite plus tard (le code actuel n'en a aucune,
    # verifie a l'audit, mais un header n'a pas vocation a remplacer un code sans faille). CSP
    # reste permissive sur script/style pour ne pas casser le build Angular (pas teste en prod
    # ici) - a durcir si l'occasion se presente, mais ces 4 headers ne changent rien au
    # fonctionnement normal de l'app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # fix/audit-gaps (troubleshooting.md #40) : DOIT preceder "location /api/" ci-dessous (prefixe
    # plus specifique, nginx retient le plus long qui matche) - sinon jamais atteint. Limite le
    # brute-force/credential-stuffing sur le seul endpoint qui n'a aucune protection applicative
    # (auth-service ne fait ni lockout ni delai, voir troubleshooting.md #40).
    location /api/auth/login {
        # fix/audit-gaps (troubleshooting.md #40) : 429 est le code HTTP correct pour
        # "too many requests" (RFC 6585) - sans cette ligne nginx renvoie 503 par defaut,
        # ambigu pour un client qui ne saurait pas distinguer un vrai crash d'un simple throttle.
        limit_req_status 429;
        limit_req zone=login_zone burst=3 nodelay;
        set $api_gateway_upstream https://api-gateway:8080;
        proxy_pass $api_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_gateway_upstream https://api-gateway:8080;
        proxy_pass $api_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
