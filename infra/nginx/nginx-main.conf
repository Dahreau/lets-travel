user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    # fix/audit-gaps (troubleshooting.md #40) : limit_req_zone n'est valide qu'au niveau http,
    # donc pas possible directement dans infra/nginx/nginx.conf (monte en conf.d/default.conf,
    # deja a l'interieur du bloc http fourni par l'image nginx:alpine) - d'ou ce fichier qui
    # remplace l'image de base UNIQUEMENT pour ajouter cette ligne, le reste est le nginx.conf
    # par defaut de nginx:1.27-alpine. Le limit_req effectif est applique dans conf.d/default.conf
    # (location /api/auth/login), zone partagee ici. 5r/m + burst=3 : bloque un brute-force
    # credential-stuffing sans gener un utilisateur qui se trompe 2-3 fois de mot de passe.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
