name: lets-travel-ci

services:
  jenkins:
    build:
      context: ./jenkins
    container_name: lets-travel-jenkins
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SONAR_TOKEN: ${SONAR_TOKEN}
      HOST_REPO_PATH: ${HOST_REPO_PATH}
    ports:
      # 8091 (pas 8090) : 8090 est le port de l'instance travel-plan, gardee utilisable en parallele.
      - "8091:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - maven_repo:/var/jenkins_home/.m2
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_REPO_PATH}/infra/ci/deploy-workspace:${HOST_REPO_PATH}/infra/ci/deploy-workspace
      # Sans ce mount, STATE_DIR (cf Jenkinsfile, stage Deploy) est ecrit dans la
      # couche ecriture EPHEMERE du conteneur Jenkins, pas sur le disque hote : la
      # sauvegarde de .unseal-key.txt/certs ne survit pas a une recreation du
      # conteneur jenkins (rebuild, docker compose up --build, etc).
      - ${HOST_REPO_PATH}/infra/ci/persistent-state:${HOST_REPO_PATH}/infra/ci/persistent-state
    networks:
      - ci

  sonarqube:
    image: sonarqube:community
    container_name: lets-travel-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      # 9001 (pas 9000) : 9000 est le port de l'instance travel-plan, gardee utilisable en parallele.
      - "9001:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - ci

  sonarqube-db:
    image: postgres:16-alpine
    container_name: lets-travel-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ci

volumes:
  jenkins_home:
  maven_repo:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

networks:
  ci:
    driver: bridge
