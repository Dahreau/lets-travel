<app-page-header [title]="isEdit() ? 'modifier utilisateur' : 'nouvel utilisateur'" />

@if (loading()) {
  <app-spinner />
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" class="card">
    <div class="form-grid">
      <app-name-contact-fields
        [firstName]="form.controls.firstName"
        [lastName]="form.controls.lastName"
        [email]="form.controls.email"
        [phone]="form.controls.phone"
      />

      <div class="field">
        <label class="label" for="role">Rôle<span class="req">*</span></label>
        <select id="role" class="select" formControlName="role">
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>
    </div>

    <div class="checkbox-row" style="margin: 8px 0 16px">
      <input type="checkbox" [checked]="hasAddress()" (change)="toggleAddress()" id="hasAddress" />
      <label for="hasAddress">adresse renseignée</label>
    </div>

    @if (canCreateAccount()) {
      <div class="checkbox-row" style="margin: 8px 0 16px">
        <input type="checkbox" [checked]="wantsAccount()" (change)="toggleWantsAccount()" id="wantsAccount" />
        <label for="wantsAccount">créer un compte de connexion pour cet utilisateur</label>
      </div>

      @if (wantsAccount()) {
        <div class="subcard">
          <div class="form-grid">
            <div class="field">
              <label class="label" for="username">Nom d'utilisateur<span class="req">*</span></label>
              <input id="username" class="input" formControlName="username" />
            </div>
            <div class="field">
              <label class="label" for="password">Mot de passe<span class="req">*</span></label>
              <input id="password" class="input" type="password" formControlName="password" />
            </div>
          </div>
        </div>
      }
    }

    @if (hasAddress()) {
      <div class="subcard">
        <div class="form-grid">
          <app-address-fields [group]="form.controls.address" />
        </div>
      </div>
    }

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'enregistrement...' : '$ enregistrer' }}
      </button>
      <a routerLink="/users" class="btn btn-ghost">annuler</a>
    </div>
  </form>
}
