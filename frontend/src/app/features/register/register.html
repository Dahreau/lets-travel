<div class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="ascii">[ 01 ]</div>
      <h1 class="login-title">travel-plan<span class="blink">_</span></h1>
      <p class="login-subtitle">// inscription traveler</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="label" for="firstName">Prénom<span class="req">*</span></label>
        <input
          id="firstName"
          class="input"
          formControlName="firstName"
          [class.invalid]="form.controls.firstName.invalid && form.controls.firstName.touched"
        />
      </div>

      <div class="field">
        <label class="label" for="lastName">Nom<span class="req">*</span></label>
        <input
          id="lastName"
          class="input"
          formControlName="lastName"
          [class.invalid]="form.controls.lastName.invalid && form.controls.lastName.touched"
        />
      </div>

      <div class="field">
        <label class="label" for="email">Email<span class="req">*</span></label>
        <input
          id="email"
          class="input"
          type="email"
          formControlName="email"
          [class.invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
      </div>

      <div class="field">
        <label class="label" for="phone">Téléphone</label>
        <input id="phone" class="input" formControlName="phone" />
      </div>

      <div class="field">
        <label class="label" for="username">login<span class="req">*</span></label>
        <input
          id="username"
          class="input"
          formControlName="username"
          autocomplete="username"
          [class.invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
      </div>

      <div class="field">
        <label class="label" for="password">password<span class="req">*</span></label>
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        <!-- minLength(6) invisible dans un champ masque : seul champ requerant un indice permanent. -->
        <p class="login-subtitle" style="margin-top: 4px">6 caractères minimum</p>
      </div>

      <div class="checkbox-row" style="margin: 8px 0 16px">
        <input type="checkbox" [checked]="hasAddress()" (change)="toggleAddress()" id="hasAddress" />
        <label for="hasAddress">adresse renseignée</label>
      </div>

      @if (hasAddress()) {
        <div class="subcard" [formGroup]="form.controls.address">
          <div class="field">
            <label class="label" for="street">Rue<span class="req">*</span></label>
            <input
              id="street"
              class="input"
              formControlName="street"
              [class.invalid]="form.controls.address.controls.street.invalid && form.controls.address.controls.street.touched"
            />
          </div>
          <div class="field">
            <label class="label" for="city">Ville<span class="req">*</span></label>
            <input
              id="city"
              class="input"
              formControlName="city"
              [class.invalid]="form.controls.address.controls.city.invalid && form.controls.address.controls.city.touched"
            />
          </div>
          <div class="field">
            <label class="label" for="postalCode">Code postal<span class="req">*</span></label>
            <input
              id="postalCode"
              class="input"
              formControlName="postalCode"
              [class.invalid]="form.controls.address.controls.postalCode.invalid && form.controls.address.controls.postalCode.touched"
            />
          </div>
          <div class="field">
            <label class="label" for="country">Pays<span class="req">*</span></label>
            <input
              id="country"
              class="input"
              formControlName="country"
              [class.invalid]="form.controls.address.controls.country.invalid && form.controls.address.controls.country.touched"
            />
          </div>
        </div>
      }

      <!-- fix/audit-gaps (troubleshooting.md #41) : consentement RGPD obligatoire, jamais
           coche par defaut cote client (register.ts) et cote backend (@AssertTrue). -->
      <div class="checkbox-row" style="margin: 8px 0 16px">
        <input
          type="checkbox"
          id="acceptedPrivacyPolicy"
          formControlName="acceptedPrivacyPolicy"
          [class.invalid]="form.controls.acceptedPrivacyPolicy.invalid && form.controls.acceptedPrivacyPolicy.touched"
        />
        <label for="acceptedPrivacyPolicy">
          j'ai lu et j'accepte la
          <a routerLink="/politique-de-confidentialite" target="_blank" rel="noopener">politique de confidentialité</a><span class="req">*</span>
        </label>
      </div>

      @if (errorMessage()) {
        <p class="error-text login-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn btn-primary login-submit" [disabled]="loading()">
        @if (loading()) {
          creating account...
        } @else {
          $ register
        }
      </button>
    </form>

    <p class="login-subtitle" style="margin-top: 16px; text-align: center">
      <a routerLink="/login">← déjà un compte ?</a>
    </p>
  </div>
</div>
