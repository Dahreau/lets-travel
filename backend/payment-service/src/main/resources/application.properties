spring.application.name=payment-service
server.port=${SERVER_PORT:8084}

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db?sslmode=require
spring.datasource.username=${DB_USERNAME:payment_user}
spring.datasource.password=${DB_PASSWORD:changeme_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.vault.addr=${VAULT_ADDR:https://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}
app.vault.tls-cert-path=${VAULT_TLS_CERT_PATH:/etc/vault-tls/vault.crt}

app.stripe.api-base=${STRIPE_API_BASE:https://api.stripe.com}
app.paypal.api-base=${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}

# Premier appel sortant de payment-service vers un autre microservice (voir client/TravelServiceClientConfig) :
# recupere le prix reel d'un voyage aupres de travel-service plutot que de faire confiance a un montant
# fourni par le client. 2 instances explicites, meme raison que dans api-gateway (voir son application.properties) :
# sans ca le client HTTP garde sa connexion keep-alive sur le premier replica resolu par le DNS Docker.
spring.cloud.discovery.client.simple.instances.travel-service[0].uri=${TRAVEL_SERVICE_URI_1:http://localhost:8083}
spring.cloud.discovery.client.simple.instances.travel-service[1].uri=${TRAVEL_SERVICE_URI_2:http://localhost:8083}
