spring.application.name=user-service
server.port=${SERVER_PORT:8082}

management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db?sslmode=require
spring.datasource.username=${DB_USERNAME:user_user}
spring.datasource.password=${DB_PASSWORD:changeme_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.vault.addr=${VAULT_ADDR:https://localhost:8200}
app.vault.role-id=${VAULT_ROLE_ID:}
app.vault.secret-id=${VAULT_SECRET_ID:}
app.vault.tls-cert-path=${VAULT_TLS_CERT_PATH:/etc/vault-tls/vault.crt}

# voir troubleshooting.md #38 - verifie que le traveler est abonne au manager appelant avant de
# renvoyer son profil (client/TravelServiceClient) ; memes instances que payment-service.
spring.cloud.discovery.client.simple.instances.travel-service[0].uri=${TRAVEL_SERVICE_URI_1:http://localhost:8083}
spring.cloud.discovery.client.simple.instances.travel-service[1].uri=${TRAVEL_SERVICE_URI_2:http://localhost:8083}

# voir troubleshooting.md #41 - appele par AuthServiceClient pour supprimer le compte de
# connexion associe (DELETE /api/users/me ou /{id}).
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=${AUTH_SERVICE_URI_1:http://localhost:8081}
spring.cloud.discovery.client.simple.instances.auth-service[1].uri=${AUTH_SERVICE_URI_2:http://localhost:8081}
