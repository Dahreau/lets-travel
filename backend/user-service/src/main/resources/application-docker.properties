# Profil docker uniquement : un bundle SSL dans application.properties ferait planter
# `mvn test` (validation eager au demarrage) en cherchant un cert qui n'existe qu'en conteneur.
server.ssl.enabled=true
server.ssl.bundle=internal-services
spring.ssl.bundle.pem.internal-services.keystore.certificate=file:/etc/internal-tls/internal.crt
spring.ssl.bundle.pem.internal-services.keystore.private-key=file:/etc/internal-tls/internal.key

# fix/audit-gaps : confiance TLS pour l'appel sortant vers travel-service (client/TravelServiceClientConfig).
# Sans ce truststore, le RestClient sortant utilise le cacerts JVM par defaut, qui ne connait pas
# ce certificat auto-signe -> SSLHandshakeException (meme gap que payment-service, troubleshooting.md #36
# et #38).
spring.http.client.ssl.bundle=internal-services
spring.ssl.bundle.pem.internal-services.truststore.certificate=file:/etc/internal-tls/internal.crt
