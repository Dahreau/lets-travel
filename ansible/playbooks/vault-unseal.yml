---
# Vault tourne en mode serveur réel (storage "file", TLS) : scellé à chaque conteneur neuf, initialisé une seule fois.
# Toutes les commandes passent par `docker compose exec` (CLI vault interne) car le port 8200 n'est plus publié sur l'host.
- name: Initialize and unseal Vault
  hosts: travel_plan
  vars:
    project_dir: "{{ playbook_dir }}/../.."
    unseal_key_file: "{{ project_dir }}/infra/vault/.unseal-key.txt"

  tasks:
    - name: Ensure .env exists (copied from .env.example on first run only)
      ansible.builtin.copy:
        src: "{{ project_dir }}/.env.example"
        dest: "{{ project_dir }}/.env"
        force: false
        mode: "0600"

    - name: Ensure the Vault certs directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/infra/vault/certs"
        state: directory
        mode: "0755"

    - name: Generate a self-signed TLS certificate for Vault's listener (skipped if it already exists)
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - "{{ project_dir }}/infra/vault/certs/vault.key"
          - -out
          - "{{ project_dir }}/infra/vault/certs/vault.crt"
          - -days
          - "365"
          - -subj
          - /CN=vault
          - -addext
          - subjectAltName=DNS:vault
        creates: "{{ project_dir }}/infra/vault/certs/vault.crt"

    - name: Fix ownership of the persistent Vault data volume (a brand-new Docker volume is created owned by root, but the Vault image runs as a non-root user)
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - run
          - --rm
          - --user
          - root
          - --entrypoint
          - sh
          - vault
          - -c
          - mkdir -p /vault/data && chown -R vault:vault /vault/data
      changed_when: true

    - name: Start only the Vault container (it must be running before it can be initialized/unsealed)
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - up
          - -d
          - vault
      changed_when: true

    - name: Wait for the Vault CLI to respond inside the container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ project_dir }}"
          - exec
          - -T
          - vault
          - vault
          - status
          - -format=json
      register: vault_status_raw
      until: vault_status_raw.rc in [0, 2]
      retries: 20
      delay: 3
      changed_when: false
      failed_when: false

    - name: Parse Vault status
      ansible.builtin.set_fact:
        vault_status: "{{ vault_status_raw.stdout | from_json }}"

    - name: Check whether a usable unseal key is stored on disk
      ansible.builtin.stat:
        path: "{{ unseal_key_file }}"
      register: unseal_key_stat

    - name: Self-heal - Vault initialized but unseal key missing (data is disposable, cf. bootstrap.sh)
      when:
        - vault_status.initialized | default(false)
        - not unseal_key_stat.stat.exists
      ansible.builtin.include_tasks: vault-reset.yml

    - name: Initialize (if needed) and unseal Vault
      ansible.builtin.include_tasks: vault-init-and-unseal.yml

    # Cas non couvert par le self-heal ci-dessus : la cle EST presente sur disque mais ne
    # correspond plus au volume Vault reel (ex. Vault reinitialise hors du flux Jenkins, comme
    # la recidive du 31/08 - voir troubleshooting.md #18). Un seul reset+reinit automatique
    # avant d'abandonner, pour ne jamais boucler indefiniment sur un vrai probleme Vault.
    - name: Self-heal - stored unseal key does not match the running Vault instance (data is disposable, cf. bootstrap.sh)
      when: vault_unseal_result.rc | default(0) != 0
      block:
        - ansible.builtin.include_tasks: vault-reset.yml
        - ansible.builtin.include_tasks: vault-init-and-unseal.yml

    - name: Fail loudly if Vault is still sealed after a reset+reinit retry
      ansible.builtin.fail:
        msg: "Vault reste scelle meme apres reinitialisation complete du volume - verifier les logs du conteneur vault (docker compose logs vault)."
      when: vault_unseal_result.rc | default(0) != 0

# Pourquoi une seule part de clé (-key-shares=1 -key-threshold=1) : le partage de Shamir sert à répartir
# la confiance entre plusieurs opérateurs humains - ici un seul (Ansible/Jenkins) gère tout, une clé unique suffit (disque, 0600, jamais commitée).
