---
# Enchaîne les playbooks dans l'ordre : vault-unseal.yml démarre/descelle Vault, puis deploy.yml
# tourne deux fois (avant/après fetch-vault-secrets.yml) pour relancer les services avec les vrais identifiants Vault.
- import_playbook: install-docker.yml
- import_playbook: vault-unseal.yml
- import_playbook: deploy.yml
  vars:
    tolerate_unhealthy_dependencies: true
- import_playbook: fetch-vault-secrets.yml
- import_playbook: deploy.yml
  vars:
    tolerate_unhealthy_dependencies: false
